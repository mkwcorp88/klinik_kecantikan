ServerTokens Prod
ServerSignature Off
DirectoryIndex index.php

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/html/migrations>
    Require all denied
</Directory>

<Directory /var/www/html/partials>
    Require all denied
</Directory>

<Directory /var/www/html/vendor>
    Require all denied
</Directory>

<Directory /var/www/html/docker>
    Require all denied
</Directory>

<FilesMatch "^(?:\..*|Dockerfile|config\.php|config\.local\.php(?:\.example)?|composer\.(?:json|lock)|bootstrap\.php)$">
    Require all denied
</FilesMatch>

<FilesMatch "\.(?:sql|md)$">
    Require all denied
</FilesMatch>
